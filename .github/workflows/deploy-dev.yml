# Deploy to Dev (Beta) — runs on every push to dev branch and supports manual trigger.
#
# Required GitHub Secrets (Settings > Secrets > Actions):
#   DEV_SSH_HOST   — IP address or hostname of the dev server
#   DEV_SSH_USER   — SSH username (e.g. root)
#   DEV_SSH_KEY    — Private SSH key, full PEM contents
#   DEV_SSH_PORT   — SSH port (optional, defaults to 22)
#   DEV_APP_PATH   — Absolute path to the app on the server (e.g. /opt/keshav-kitchen)

name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEV_SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}" \
            "cd '${{ secrets.DEV_APP_PATH }}' && git pull origin dev && npm run deploy:dev"
