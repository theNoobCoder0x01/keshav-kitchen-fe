# Deploy to Production — MANUAL TRIGGER ONLY. Never runs automatically.
# Requires the "production" environment to be configured in GitHub Settings
# (Settings > Environments > production) with required reviewers for extra safety.
#
# Required GitHub Secrets — configure these in Settings > Secrets > Actions:
#   PROD_SSH_HOST   — IP address or hostname of the prod server
#   PROD_SSH_USER   — SSH username (e.g. root or deploy)
#   PROD_SSH_KEY    — Private SSH key in PEM format (the entire key contents)
#   PROD_SSH_PORT   — SSH port (default 22)
#   PROD_APP_PATH   — Absolute path to the app on the prod server (e.g. /opt/keshav-kitchen)

name: Deploy Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ${{ secrets.PROD_APP_PATH }} && git pull origin main && npm run deploy:prod
