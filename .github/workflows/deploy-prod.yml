# Deploy to Production — MANUAL TRIGGER ONLY. Never runs automatically.
# Requires the "production" environment to be configured in GitHub Settings
# (Settings > Environments > production) with required reviewers for extra safety.
#
# Required GitHub Secrets (Settings > Secrets > Actions):
#   PROD_SSH_HOST   — IP address or hostname of the prod server
#   PROD_SSH_USER   — SSH username (e.g. root)
#   PROD_SSH_KEY    — Private SSH key, full PEM contents
#   PROD_SSH_PORT   — SSH port (optional, defaults to 22)
#   PROD_APP_PATH   — Absolute path to the app on the server (e.g. /opt/keshav-kitchen)

name: Deploy Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        run: |
          APP_PATH="${{ secrets.PROD_APP_PATH }}"
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.PROD_SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "export NVM_DIR=\"\$HOME/.nvm\"; [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"; cd \"$APP_PATH\" && git pull origin main && npm run deploy:prod"
