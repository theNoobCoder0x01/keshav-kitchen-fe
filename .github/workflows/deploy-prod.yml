# Deploy to Production — MANUAL TRIGGER ONLY. Never runs automatically.
# Requires the "production" environment to be configured in GitHub Settings
# (Settings > Environments > production) with required reviewers for extra safety.
#
# Required GitHub Secrets (Settings > Secrets > Actions):
#   PROD_SSH_HOST   — IP address or hostname of the prod server
#   PROD_SSH_USER   — SSH username (e.g. root)
#   PROD_SSH_KEY    — Private SSH key, full PEM contents
#   PROD_SSH_PORT   — SSH port (default 22)
#   PROD_APP_PATH   — Absolute path to the app on the server (e.g. /opt/keshav-kitchen)

name: Deploy Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PATH: ${{ secrets.PROD_APP_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: APP_PATH
          script: |
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: PROD_APP_PATH secret is not set or empty"
              exit 1
            fi
            cd "$APP_PATH"
            git pull origin main
            npm run deploy:prod
