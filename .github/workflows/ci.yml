# CI — Lint, typecheck, and build on every PR and push to dev or main.
# Lint and typecheck run in parallel; build waits for both to pass.
# PUPPETEER_SKIP_DOWNLOAD=true prevents Chromium download during build.

name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXTAUTH_SECRET: ci-build-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      PUPPETEER_SKIP_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
